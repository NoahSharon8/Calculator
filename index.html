<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Calculator</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

<div id="calc">

    <div id="keypad">
        <button class="keyy" onclick="add('9')">9</button>
        <button class="keyy" onclick="add('8')">8</button>
        <button class="keyy" onclick="add('7')">7</button>
        <button class="keyy" onclick="add('+')">+</button>
        <button class="keyy" onclick="add('6')">6</button>
        <button class="keyy" onclick="add('5')">5</button>
        <button class="keyy" onclick="add('4')">4</button>
        <button class="keyy" onclick="add('-')">-</button>
        <button class="keyy" onclick="add('3')">3</button>
        <button class="keyy" onclick="add('2')">2</button>
        <button class="keyy" onclick="add('1')">1</button>
        <button class="keyy" onclick="add('*')">*</button>
        <button class="keyy" onclick="add('0')">0</button>
        <button class="keyy" onclick="add('(')">(</button>
        <button class="keyy" onclick="add(')')">)</button>
        <button class="keyy" onclick="add('/')">/</button>
        <button class="keyy" onclick="add('.')">.</button>
        <button class="keyy" onclick="add('%')">%</button>
        <button class="keyy" onclick="add('**')">**</button>
        <button class="keyy" onclick="calculate()">=</button>
    </div>

    <div id="arrows">
        <button class="arrow" onclick="up()">⇧</button>
        <button class="arrow" onclick="down()">⇩</button>
    </div>

    <div id="equations">
        <div class="pasty" onclick="before(0)">Past EQ</div>
        <div class="pasty" onclick="before(1)">Past EQ</div>
        <div class="pasty" onclick="before(2)">Past EQ</div>
        <div class="pasty" onclick="before(3)">Past EQ</div>
        <div id="current">Current EQ</div>
        <div id="answer">Answer</div>
    </div>

</div>

<script src="index.js"></script>
</body>
</html>
